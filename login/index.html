<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="login.css">
    <title>Sign Up | Pixel Flower Studio</title>

</head>

<body>

    <div class="container">

        <div class="web-image">
            <div class="top-content">

                <div class="logo">
                    <img src="/assets/Lifestyle Flower Logo.png" alt="Pixel Flower Studio">
                    <a href="#"><button>Back to Website &rarr;</button></a>
                </div>

            </div>

            <div class="bottom-content">
                <h3 style="color: white;">
                    Capturing Moments,
                    Creating Memories
                </h3>

                <div class="scroll-indicator">
                    <p style="color: white;">Scroll Down</p>
                    <i style="color: white;" class="bi bi-chevron-double-down fs-2"></i>
                </div>
            </div>

        </div>

        <form action="#" method="post" id="form">
            <div class="input-group">
                <h5 style="color: white;">Create an account</h5>
                <p style="color: whitesmoke;">Already have an account? <a href="#">Log in</a></p>
            </div>

            <div class="name">
                <div class="input-group">
                    <input type="text" id="user_firstname" name="firstName">
                    <label for="user_firstname">First Name</label>
                </div>

                <div class="input-group">
                    <input type="text" id="user_surname" name="surname">
                    <label for="user_surname">Last Name</label>
                </div>
            </div>

            <div class="input-group">
                <input type="email" id="user_email" name="email" class="form-control">
                <label for="user_email">Email Address</label>
            </div>

            <div class="input-group">
                <input type="password" id="user_password" name="password">
                <label for="user_password">Create Password</label>
            </div>

            <div class="input-group">
                <input type="password" id="user_password" name="password">
                <label for="user_password">Confirm Password</label>
            </div>

            <div class="checkbox">
                <div><input type="checkbox" id="checkbox" name="radio"></div>
                <label for="checkbox">
                    <p style="color: white;">agree to the <a href="#">Terms & conditions</a></p>
                </label>
            </div>

            <div>
                <button type="submit" id="submit-btn">Create account</button>
            </div>

            <div style="display: flex; align-items:center;">
                <hr style="flex: 1;">
                <span style="padding: 0 10px; color: white;">or register with</span>
                <hr style="flex: 1;">
            </div>

            <div id="sign-btn">
                <button class="google-btn"> <i class="bi bi-google"></i>Google</button>
                <button class="apple-btn"> <i class="bi bi-apple"></i>Apple</button>
            </div>

        </form>




    </div>








































    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
</body>

</html>
